<body>

<h1>🎁 Cofres – Final Strike League</h1>
<p>Haz clic en el cofre para abrirlo</p>

<h3>👤 Nombre del jugador</h3>
<input type="text" id="nombreJugador" placeholder="Tu nombre aquí">

<h3>🔑 Ingresa tu código de cofre</h3>
<input type="text" id="codigoInput" placeholder="Código aquí">

<br>
<button onclick="abrirCofre()">Abrir Cofre</button>

<p>Cofres abiertos: <span id="contador">0</span></p>
<p>Piedad: <span id="piedad">0</span> / 20</p>

<div class="resultado" id="resultado"></div>
<div class="log" id="log"></div>

<!-- ================= LÓGICA DE COFRES ================= -->
<script>
let codigosValidos = ["FS-001","FS-002","FS-003"];
let codigosUsados = [];

let cofresAbiertos = 0;
let piedad = 0;
const PIEDAD_MAX = 20;

const perksBronze = [
    "Perk de Gagamaru",
    "Perk León Rojo",
    "Perk No perderé de vuelta",
    "Perk EX Delantero",
    "Perk del Monstruo",
    "Perk Maestro de la Adaptabilidad"
];

const perksRara = ["Perk de Hiori"];

const perksLegendaria = [
    "Perk del Emperador",
    "Perk del Egoísta",
    "Perk del Genio Total"
];

function obtenerAleatoria(lista) {
    return lista[Math.floor(Math.random() * lista.length)];
}

function abrirCofre() {
    const nombre = document.getElementById("nombreJugador").value.trim();
    const codigo = document.getElementById("codigoInput").value.trim();

    if (!nombre || !codigo) {
        alert("Completa nombre y código");
        return;
    }

    if (!codigosValidos.includes(codigo)) {
        alert("Código inválido o ya usado");
        return;
    }

    codigosValidos = codigosValidos.filter(c => c !== codigo);
    codigosUsados.push(codigo);

    cofresAbiertos++;
    piedad++;

    let perk = "";
    let rareza = "";

    if (piedad >= PIEDAD_MAX) {
        perk = obtenerAleatoria(perksLegendaria);
        rareza = "LEGENDARIA 👑 (GARANTIZADA)";
        piedad = 0;
    } else {
        const r = Math.random() * 100;
        if (r < 5) {
            perk = obtenerAleatoria(perksLegendaria);
            rareza = "LEGENDARIA 👑";
            piedad = 0;
        } else if (r < 30) {
            perk = obtenerAleatoria(perksRara);
            rareza = "RARA 💎";
        } else {
            perk = obtenerAleatoria(perksBronze);
            rareza = "BRONZE 🟤";
        }
    }

    document.getElementById("contador").textContent = cofresAbiertos;
    document.getElementById("piedad").textContent = piedad;

    document.getElementById("resultado").innerHTML =
        `<strong>${perk}</strong><br>${rareza}<br>Código usado: ${codigo}`;
}
</script>
