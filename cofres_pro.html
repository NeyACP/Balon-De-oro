<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ruleta Cofre – Final Strike League</title>

<!-- FUENTE GÓTICA -->
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>
body{
    background:radial-gradient(circle,#0a0f2c,#000);
    font-family:'UnifrakturCook', cursive;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.ruleta-container{
    background:#050816;
    border:2px solid #1a237e;
    border-radius:15px;
    padding:20px;
    width:280px;
    text-align:center;
    box-shadow:0 0 20px #0d47a1;
}

.titulo{
    font-size:22px;
    margin-bottom:10px;
}

.tragamonedas{
    position:relative;
    height:150px;
    overflow:hidden;
    border:2px solid #222;
    border-radius:10px;
    background:#000;
}

.flecha{
    position:absolute;
    right:-20px;
    top:50%;
    transform:translateY(-50%);
    font-size:30px;
    color:#ffd700;
}

.slot{
    height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    transition:0.2s;
}

.bronze{ color:#cd7f32; }
.rara{ color:#2196f3; }
.legendaria{
    color:#ffd700;
    text-shadow:0 0 8px gold;
}

.boton{
    margin-top:15px;
    padding:10px;
    width:100%;
    background:#0d47a1;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:8px;
}
.boton:hover{ background:#1565c0; }

.piedad{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="ruleta-container">
    <div class="titulo">🎰 Cofre de Perks</div>

    <div class="tragamonedas">
        <div id="slots">
            <div class="slot">---</div>
            <div class="slot">---</div>
            <div class="slot">---</div>
        </div>
        <div class="flecha">▶</div>
    </div>

    <button class="boton" onclick="abrirCofre()">Abrir Cofre</button>

    <div class="piedad">
        Piedad: <span id="piedad">0</span> / 15
    </div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, update } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
  authDomain: "thefinalstrike-4358b.firebaseapp.com",
  databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
  projectId: "thefinalstrike-4358b",
  storageBucket: "thefinalstrike-4358b.appspot.com",
  messagingSenderId: "857358899579",
  appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db=db;
window.ref=ref;
window.get=get;
window.set=set;
window.update=update;
</script>

<script>
const perks=[
 {nombre:"Perk de Gagamaru", rareza:"bronze"},
 {nombre:"Perk del León Rojo", rareza:"bronze"},
 {nombre:"Perk del Monstruo", rareza:"bronze"},
 {nombre:"Perk del ex-delantero", rareza:"bronze"},
 {nombre:"Perk del maestro de la adaptabilidad", rareza:"bronze"},
 {nombre:"Perk de No voy a perder", rareza:"bronze"},
 {nombre:"Perk Hiori", rareza:"rara"},
 {nombre:"Perk Emperador", rareza:"legendaria"},
 {nombre:"Perk del Egoísta", rareza:"legendaria"},
 {nombre:"Perk del genio total", rareza:"legendaria"}
];

const jugadorID = "jugador-demo"; // luego lo conectas a tu sistema real
const piedadMax = 15;

async function cargarPiedad(){
    const snap = await get(ref(db,"piedad/"+jugadorID));
    const p = snap.exists()? snap.val().contador : 0;
    document.getElementById("piedad").textContent = p;
    return p;
}

async function guardarPiedad(valor){
    await set(ref(db,"piedad/"+jugadorID),{
        contador:valor,
        fecha:Date.now()
    });
    document.getElementById("piedad").textContent = valor;
}

function elegirPerk(piedad){
    if(piedad >= piedadMax){
        return perks.filter(p=>p.rareza==="legendaria")[Math.floor(Math.random()*3)];
    }
    const r=Math.random();
    if(r<0.7) return perks.filter(p=>p.rareza==="bronze")[Math.floor(Math.random()*6)];
    if(r<0.9) return perks.filter(p=>p.rareza==="rara")[0];
    return perks.filter(p=>p.rareza==="legendaria")[Math.floor(Math.random()*3)];
}

async function abrirCofre(){
    let piedad = await cargarPiedad();
    const perk = elegirPerk(piedad);

    animar(perk);

    if(perk.rareza==="legendaria"){
        guardarPiedad(0);
    }else{
        guardarPiedad(piedad+1);
    }
}

function animar(perk){
    const slots=document.getElementById("slots");
    slots.innerHTML="";

    const prev=perks[Math.floor(Math.random()*perks.length)];
    const next=perks[Math.floor(Math.random()*perks.length)];

    [prev,perk,next].forEach(p=>{
        const d=document.createElement("div");
        d.className="slot "+p.rareza;
        d.textContent=p.nombre;
        slots.appendChild(d);
    });
}

cargarPiedad();
</script>

</body>
</html>
