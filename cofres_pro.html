<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cofres – Final Strike League</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body {
  background: #0f0f0f;
  color:white;
  font-family: 'Orbitron', sans-serif;
  text-align:center;
  overflow-x: hidden;
}

#slot-container {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 20px auto;
  overflow: hidden;
  border: 3px solid #0ff;
  border-radius: 20px;
  box-shadow: 0 0 20px #0ff inset;
  background: radial-gradient(circle at center, #111 0%, #000 100%);
}

#slot {
  display: flex;
  flex-direction: column;
}

.casilla {
  height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
  color:white;
  text-shadow: 0 0 5px #0ff;
}

.casilla img {
  width: 60px;
  height: 60px;
  margin-bottom: 5px;
  border-radius: 10px;
  box-shadow: 0 0 10px #0ff;
}

.casilla.bronze { background:#422f00; }
.casilla.rara { background:#003366; }
.casilla.legendaria { background:#660066; }

#piedad {
  width: 80%;
  height: 20px;
  background:#222;
  border-radius: 10px;
  margin: 20px auto;
  overflow: hidden;
  box-shadow: 0 0 10px #0ff inset;
}
#piedad-fill {
  height:100%;
  width:0%;
  background: linear-gradient(90deg, #0ff, #00f, #0ff);
  border-radius: 10px;
  transition: width 0.5s ease;
}

#piedad-text {
  position:absolute;
  width: 100%;
  margin-top:-20px;
  font-size:12px;
  text-align:center;
  color:#0ff;
  text-shadow: 0 0 5px #0ff;
}

button {
  padding:10px 20px;
  margin:5px;
  font-weight:bold;
  background:#0ff;
  border:none;
  border-radius:10px;
  color:#000;
  cursor:pointer;
  text-transform:uppercase;
  font-family: 'Orbitron', sans-serif;
}

button:hover {
  background:#00f;
  color:#fff;
}
</style>
</head>
<body>

<h1>🎁 Cofres – Final Strike League</h1>

<input id="nombreJugador" placeholder="Nombre del jugador"><br>
<input id="codigoInput" placeholder="Código del cofre"><br>
<button id="btnAbrir">Abrir Cofre</button>

<div id="slot-container">
  <div id="slot"></div>
</div>

<div id="piedad">
  <div id="piedad-fill"></div>
  <div id="piedad-text">0 / 20 (0%)</div>
</div>

<div class="resultado" id="resultado"></div>

<audio id="sonidoGiro" src="audio/giro.mp3"></audio>
<audio id="sonidoPremio" src="audio/premio.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, get, child, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 Config Firebase */
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  databaseURL: "TU_DB_URL",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_STORAGE",
  messagingSenderId: "TU_MSG_SENDER",
  appId: "TU_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🎲 Perks */
const perks = [
  {id:"perkgagamaru", nombre:"Perk Gagamaru", rareza:"bronze"},
  {id:"perkleonrojo", nombre:"Perk León Rojo", rareza:"bronze"},
  {id:"perkmonstruo", nombre:"Perk Monstruo", rareza:"bronze"},
  {id:"perkhiori", nombre:"Perk Hiori", rareza:"rara"},
  {id:"perkemperador", nombre:"Perk Emperador", rareza:"legendaria"},
  {id:"perkegoista", nombre:"Perk Egoísta", rareza:"legendaria"}
];

let giros = 0;

/* Función para crear pool de perks según probabilidades */
function crearPool(){
  const pool=[];
  for(let i=0;i<100;i++){
    if(i<5) pool.push(perks.find(p=>p.rareza==="legendaria"));
    else if(i<30) pool.push(perks.find(p=>p.rareza==="rara"));
    else pool.push(perks.find(p=>p.rareza==="bronze"));
  }
  return pool;
}

/* 🎁 Abrir cofre */
document.getElementById("btnAbrir").addEventListener("click", async ()=>{
  const nombre=document.getElementById("nombreJugador").value.trim();
  const codigo=document.getElementById("codigoInput").value.trim();
  if(!nombre||!codigo){ alert("Completa nombre y código"); return; }

  const snap=await get(child(ref(db),"codigos/"+codigo));
  if(!snap.exists()){ alert("Código inválido o usado"); return; }

  let pool = crearPool();
  let perkSeleccionado = pool[Math.floor(Math.random()*pool.length)];

  // Piedad cada 20 giros
  giros++;
  if(giros%20===0){
    const legendarias = perks.filter(p=>p.rareza==="legendaria");
    perkSeleccionado = legendarias[Math.floor(Math.random()*legendarias.length)];
  }

  const slot = document.getElementById("slot");
slot.innerHTML = "";

// Crear casillas
let totalCasillas = 30;
for(let i=0; i<totalCasillas; i++){
    const p = pool[Math.floor(Math.random()*pool.length)];
    const div = document.createElement("div");
    div.className = "casilla " + p.rareza;
    div.innerHTML = `<img src="img/perks/${p.id}.png" /><span>${p.nombre}</span>`;
    slot.appendChild(div);
}

// Casilla ganadora
const ganador = document.createElement("div");
ganador.className = "casilla " + perkSeleccionado.rareza;
ganador.innerHTML = `<img src="img/perks/${perkSeleccionado.id}.png" /><span>${perkSeleccionado.nombre}</span>`;
slot.appendChild(ganador);

// Forzar reflow antes de animar
slot.offsetHeight;

// Animación
slot.style.transition = "transform 4s cubic-bezier(0.33,1,0.68,1)";
slot.style.transform = `translateY(-${100*totalCasillas}px)`;

// Rebote y guardar apertura
setTimeout(async ()=>{
    slot.style.transition = "transform 0.3s ease-out";
    slot.style.transform = `translateY(-${100*(totalCasillas-0.3)}px)`;

    setTimeout(()=> slot.style.transform = `translateY(-${100*totalCasillas}px)`, 300);

    await push(ref(db,"aperturas"),{
        jugador:nombre,
        codigo,
        perk:perkSeleccionado.nombre,
        rareza:perkSeleccionado.rareza.toUpperCase(),
        fecha:new Date().toLocaleString()
    });
    await remove(ref(db,"codigos/"+codigo));
    
    document.getElementById("resultado").innerHTML = `<b>${perkSeleccionado.nombre}</b><br>${perkSeleccionado.rareza.toUpperCase()}<br>Código usado: ${codigo}`;
}, 4000);
});
</script>
</body>
</html>
