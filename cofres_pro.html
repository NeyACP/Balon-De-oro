<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cofre de Perks – Final Strike League</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>
body{
    background:radial-gradient(circle,#081026,#000);
    font-family:'UnifrakturCook', cursive;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.panel{
    width:320px;
    background:#050816;
    border:2px solid #1a237e;
    border-radius:16px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 25px #0d47a1;
}

input,button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    border:none;
    text-align:center;
}

button{
    background:#0d47a1;
    color:white;
    cursor:pointer;
}
button:hover{ background:#1565c0; }

.tragamonedas{
    height:150px;
    overflow:hidden;
    border:2px solid #222;
    border-radius:12px;
    background:black;
    position:relative;
}

.flecha{
    position:absolute;
    right:-18px;
    top:50%;
    transform:translateY(-50%);
    font-size:26px;
    color:gold;
}

.slots{
    position:absolute;
    top:0;
    width:100%;
    transition:transform 2.5s cubic-bezier(.1,.9,.2,1);
}

.slot{
    height:50px;
    display:flex;
    align-items:center;
    gap:8px;
    padding-left:10px;
    font-size:13px;
}

.slot img{
    width:32px;
    height:32px;
}

.bronze{ color:#cd7f32; }
.rara{ color:#2196f3; }
.legendaria{
    color:gold;
    text-shadow:0 0 8px gold;
}

.piedad{
    margin-top:8px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="panel">
<h2>🎰 Cofre de Perks</h2>

<input id="jugador" placeholder="Nombre del jugador">
<input id="codigo" placeholder="Código del cofre">

<button onclick="canjear()">Abrir Cofre</button>

<div class="tragamonedas">
    <div id="slots" class="slots"></div>
    <div class="flecha">▶</div>
</div>

<div class="piedad">
    Piedad: <span id="piedad">0</span> / 15
</div>
</div>

<audio id="audioGiro" src="audio/giro.mp3"></audio>
<audio id="audioNormal" src="audio/normal.mp3"></audio>
<audio id="audioLegendaria" src="audio/legendaria.mp3"></audio>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, update, push }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
  authDomain: "thefinalstrike-4358b.firebaseapp.com",
  databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
  projectId: "thefinalstrike-4358b",
  storageBucket: "thefinalstrike-4358b.appspot.com",
  messagingSenderId: "857358899579",
  appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
};

window.db = getDatabase(initializeApp(firebaseConfig));
window.ref = ref;
window.get = get;
window.set = set;
window.update = update;
window.push = push;
</script>

<script>
const piedadMax = 15;

const perks = [
 {nombre:"Perk de Gagamaru", rareza:"bronze", img:"img/gagamaru.png"},
 {nombre:"Perk del León Rojo", rareza:"bronze", img:"img/leonrojo.png"},
 {nombre:"Perk del Monstruo", rareza:"bronze", img:"img/monstruo.png"},
 {nombre:"Perk del ex-delantero", rareza:"bronze", img:"img/exdelantero.png"},
 {nombre:"Perk del maestro de la adaptabilidad", rareza:"bronze", img:"img/adaptabilidad.png"},
 {nombre:"Perk de No voy a perder", rareza:"bronze", img:"img/novoyaperder.png"},
 {nombre:"Perk Hiori", rareza:"rara", img:"img/hiori.png"},
 {nombre:"Perk Emperador", rareza:"legendaria", img:"img/emperador.png"},
 {nombre:"Perk del Egoísta", rareza:"legendaria", img:"img/egoista.png"},
 {nombre:"Perk del genio total", rareza:"legendaria", img:"img/geniototal.png"}
];

async function canjear(){
    const jugador = document.getElementById("jugador").value.trim();
    const codigo = document.getElementById("codigo").value.trim();
    if(!jugador || !codigo) return alert("Completa los datos");

    const snap = await get(ref(db,"codigos/"+codigo));
    if(!snap.exists() || snap.val().usado) return alert("Código inválido");

    let piedad = (await get(ref(db,"piedad/"+jugador))).val()?.contador || 0;

    let perk;
    if(piedad>=piedadMax){
        perk = perks.filter(p=>p.rareza==="legendaria")[Math.floor(Math.random()*3)];
    }else{
        const r=Math.random();
        if(r<0.7) perk=perks.filter(p=>p.rareza==="bronze")[Math.floor(Math.random()*6)];
        else if(r<0.9) perk=perks.filter(p=>p.rareza==="rara")[0];
        else perk=perks.filter(p=>p.rareza==="legendaria")[Math.floor(Math.random()*3)];
    }

    girar(perk);

    await update(ref(db,"codigos/"+codigo),{usado:true});
    await set(ref(db,"piedad/"+jugador),{
        contador: perk.rareza==="legendaria"?0:piedad+1
    });

    await push(ref(db,"aperturas"),{
        jugador,
        perk:perk.nombre,
        rareza:perk.rareza,
        codigo,
        fecha:new Date().toISOString()
    });

    document.getElementById("piedad").textContent =
        perk.rareza==="legendaria"?0:piedad+1;
}

function girar(perk){
    const slots=document.getElementById("slots");
    slots.innerHTML="";
    document.getElementById("audioGiro").play();

    const pool=[];
    for(let i=0;i<20;i++){
        pool.push(perks[Math.floor(Math.random()*perks.length)]);
    }
    pool.push(perk);

    pool.forEach(p=>{
        const d=document.createElement("div");
        d.className="slot "+p.rareza;
        d.innerHTML=`<img src="${p.img}"> ${p.nombre}`;
        slots.appendChild(d);
    });

    slots.style.transform=`translateY(-${(pool.length-3)*50}px)`;

    setTimeout(()=>{
        document.getElementById(
            perk.rareza==="legendaria" ? "audioLegendaria" : "audioNormal"
        ).play();
    },2500);
}
</script>

</body>
</html>
