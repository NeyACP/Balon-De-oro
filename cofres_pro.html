<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cofres – Final Strike League</title>

<style>
body {
  background:#0f0f0f;
  color:white;
  font-family:Arial;
  text-align:center;
}
input, button {
  padding:10px;
  margin:5px;
}
.resultado {
  margin-top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>🎁 Cofres – Final Strike League</h1>

<input id="nombreJugador" placeholder="Nombre del jugador"><br>
<input id="codigoInput" placeholder="Código del cofre"><br>

<button type="button" id="btnAbrir">Abrir Cofre</button>

<div class="resultado" id="resultado"></div>

<!-- ================= ABRIR COFRE CON PIEDAD ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, get, child, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
  authDomain: "thefinalstrike-4358b.firebaseapp.com",
  databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
  projectId: "thefinalstrike-4358b",
  storageBucket: "thefinalstrike-4358b.firebasestorage.app",
  messagingSenderId: "857358899579",
  appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🎲 PERKS */
const bronze = ["Perk de Gagamaru","Perk del León Rojo","Perk del Monstruo","Perk del ex-delantero","Perk del maestro de la adaptabilidad","Perk de No voy a perder"];
const rara = ["Perk Hiori"];
const legendaria = ["Perk Emperador","Perk del Egoísta","Perk del genio total"];

/* 🎁 ABRIR COFRE */
document.getElementById("btnAbrir").addEventListener("click", async () => {
  const nombre = nombreJugador.value.trim();
  const codigo = codigoInput.value.trim();

  if (!nombre || !codigo) {
    alert("Completa nombre y código");
    return;
  }

  // Verificar código
  const snap = await get(child(ref(db), "codigos/" + codigo));
  if (!snap.exists()) {
    alert("Código inválido o usado");
    return;
  }

  // Leer contador del jugador
  const contadorSnap = await get(child(ref(db), "conteos/" + nombre));
  let contador = contadorSnap.exists() ? contadorSnap.val() : 0;

  let perk = "";
  let rareza = "";

  // SISTEMA DE PIEDAD: cada 20 cofres → legendario garantizado
  if ((contador + 1) % 20 === 0) {
    perk = legendaria[Math.floor(Math.random()*legendaria.length)];
    rareza = "LEGENDARIA 👑 (PIEDAD)";
  } else {
    const r = Math.random() * 100;
    if (r < 5) {
      perk = legendaria[Math.floor(Math.random()*legendaria.length)];
      rareza = "LEGENDARIA 👑";
    } else if (r < 30) {
      perk = rara[0];
      rareza = "RARA 💎";
    } else {
      perk = bronze[Math.floor(Math.random()*bronze.length)];
      rareza = "BRONZE 🟤";
    }
  }

  // Guardar apertura
  await push(ref(db, "aperturas"), {
    jugador: nombre,
    codigo,
    perk,
    rareza,
    fecha: new Date().toLocaleString()
  });

  // Incrementar contador del jugador
  await set(ref(db, "conteos/" + nombre), contador + 1);

  // Eliminar código usado
  await remove(ref(db, "codigos/" + codigo));

  // Mostrar resultado
  resultado.innerHTML = `
    <b>${perk}</b><br>
    ${rareza}<br>
    Código usado: ${codigo}<br>
    Cofres abiertos: ${contador + 1}
  `;
});
</script>

</body>
</html>
