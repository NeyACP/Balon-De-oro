<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cofres Pro</title>
</head>

<body>

  <h2>Prueba Firebase</h2>

  <button id="btnFirebase">Probar Firebase</button>
  <button id="btnConexion">Probar Conexión</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
      authDomain: "thefinalstrike-4358b.firebaseapp.com",
      databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
      projectId: "thefinalstrike-4358b",
      storageBucket: "thefinalstrike-4358b.appspot.com",
      messagingSenderId: "857358899579",
      appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    console.log("🔥 Firebase inicializado correctamente");

    document.getElementById("btnFirebase").addEventListener("click", () => {
      alert("Firebase cargado correctamente ✅");
    });

    document.getElementById("btnConexion").addEventListener("click", async () => {
      try {
        await set(ref(db, "prueba"), {
          estado: "ok",
          fecha: Date.now()
        });
        alert("Conexión exitosa con Firebase ✅");
      } catch (error) {
        console.error(error);
        alert("Error al conectar ❌");
      }
    });
  </script>

</body>
</html>
