<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  update,
  push
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
  authDomain: "thefinalstrike-4358b.firebaseapp.com",
  databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
  projectId: "thefinalstrike-4358b",
  storageBucket: "thefinalstrike-4358b.firebasestorage.app",
  messagingSenderId: "857358899579",
  appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= COFRES ================= */
let cofresAbiertos = 0;
let piedad = 0;
const PIEDAD_MAX = 20;

const perksBronze = [
  "Perk de Gagamaru",
  "Perk León Rojo",
  "Perk No perderé de vuelta",
  "Perk EX Delantero",
  "Perk del Monstruo",
  "Perk Maestro de la Adaptabilidad"
];

const perksRara = ["Perk de Hiori"];

const perksLegendaria = [
  "Perk del Emperador",
  "Perk del Egoísta",
  "Perk del Genio Total"
];

function obtenerAleatoria(lista) {
  return lista[Math.floor(Math.random() * lista.length)];
}

/* ================= ABRIR COFRE ================= */
window.abrirCofre = async function () {
  const nombre = document.getElementById("nombreJugador").value.trim();
  const codigo = document.getElementById("codigoInput").value.trim();

  if (!nombre || !codigo) {
    alert("❌ Completa nombre y código");
    return;
  }

  const codigoRef = ref(db, "codigos/" + codigo);
  const snap = await get(codigoRef);

  if (!snap.exists()) {
    alert("❌ Código inválido");
    return;
  }

  if (snap.val().usado === true) {
    alert("❌ Código ya usado");
    return;
  }

  cofresAbiertos++;
  piedad++;

  let perk = "";
  let rareza = "";

  if (piedad >= PIEDAD_MAX) {
    perk = obtenerAleatoria(perksLegendaria);
    rareza = "LEGENDARIA 👑 (GARANTIZADA)";
    piedad = 0;
  } else {
    const r = Math.random() * 100;
    if (r < 5) {
      perk = obtenerAleatoria(perksLegendaria);
      rareza = "LEGENDARIA 👑";
      piedad = 0;
    } else if (r < 30) {
      perk = obtenerAleatoria(perksRara);
      rareza = "RARA 💎";
    } else {
      perk = obtenerAleatoria(perksBronze);
      rareza = "BRONZE 🟤";
    }
  }

  /* Marcar código como usado */
  await update(codigoRef, { usado: true });

  /* Guardar apertura */
  await push(ref(db, "aperturas"), {
    jugador: nombre,
    codigo: codigo,
    perk: perk,
    rareza: rareza,
    fecha: new Date().toLocaleString()
  });

  document.getElementById("contador").textContent = cofresAbiertos;
  document.getElementById("piedad").textContent = piedad;
  document.getElementById("resultado").innerHTML =
    `<strong>${perk}</strong><br>${rareza}<br>Código usado: ${codigo}`;
};

console.log("🎁 Cofres conectados a Firebase");
</script>
