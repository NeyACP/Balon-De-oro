  <!-- Firebase SDKs (CLÁSICO, SIN MODULE) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>

  <script>
    // ⛔ AQUÍ AÚN NO TOQUES NADA ⛔
    const firebaseConfig = {
      apiKey: "PEGA_AQUI",
      authDomain: "PEGA_AQUI",
      databaseURL: "PEGA_AQUI",
      projectId: "PEGA_AQUI",
      storageBucket: "PEGA_AQUI",
      messagingSenderId: "PEGA_AQUI",
      appId: "PEGA_AQUI"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function probarFirebase() {
      db.ref("prueba").set({
        mensaje: "Firebase conectado correctamente",
        tiempo: Date.now()
      }).then(() => {
        alert("✅ FUNCIONA. Firebase conectado.");
      }).catch(err => {
        console.error(err);
        alert("❌ Error. Mira la consola.");
      });
    }
  </script>
