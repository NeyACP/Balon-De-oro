<h1>🧑‍💼 Panel Admin – Cofres</h1>

<!-- LOGIN -->
<div id="login">
    <p>🔐 Ingresa contraseña</p>
    <input type="password" id="password">
    <br>
    <button onclick="login()">Entrar</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
    
<h2>🔑 Generador de Códigos</h2>

<button onclick="generarCodigo()">➕ Generar nuevo código</button>

<p><strong>Códigos disponibles:</strong></p>
<ul id="listaCodigos"></ul>

<hr>

    <button onclick="cargarDatos()">🔄 Actualizar</button>
    <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Jugador</th>
                <th>Perk</th>
                <th>Rareza</th>
                <th>Código</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
const PASSWORD_ADMIN = "FSL9899199123"; // cambia si quieres

function login() {
    const pass = document.getElementById("password").value;
    if (pass === PASSWORD_ADMIN) {
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";
        localStorage.setItem("adminCofres", "true");
        cargarDatos();
        mostrarCodigos(); // 🔴 ESTO ERA LO QUE FALTABA
    } else {
        alert("❌ Contraseña incorrecta");
    }
}

function cerrarSesion() {
    localStorage.removeItem("adminCofres");
    location.reload();
}

function generarCodigo() {
    let codigos = JSON.parse(localStorage.getItem("codigosValidos")) || [];

    let nuevoCodigo = "FSL-" + Math.random().toString(36).substr(2, 6).toUpperCase();

    codigos.push(nuevoCodigo);
    localStorage.setItem("codigosValidos", JSON.stringify(codigos));

    mostrarCodigos(); // 🔴 refresca la lista
}

function mostrarCodigos() {
    let codigos = JSON.parse(localStorage.getItem("codigosValidos")) || [];
    let lista = document.getElementById("listaCodigos");

    if (!lista) return;

    lista.innerHTML = "";
    codigos.forEach(codigo => {
        lista.innerHTML += `<li>${codigo}</li>`;
    });
}

function cargarDatos() {
    let historial = JSON.parse(localStorage.getItem("historialCofres")) || [];
    let tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    historial.forEach((item, i) => {
        tabla.innerHTML += `
            <tr>
                <td>${i + 1}</td>
                <td>${item.jugador}</td>
                <td>${item.perk}</td>
                <td>${item.rareza}</td>
                <td>${item.codigo}</td>
                <td>${item.fecha}</td>
            </tr>
        `;
    });
}

// Mantener sesión iniciada
if (localStorage.getItem("adminCofres") === "true") {
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
    cargarDatos();
    mostrarCodigos(); // 🔴 ESTO ES CLAVE
}
</script>
