<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Cofres – Final Strike League</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0e0e0e;
            color: white;
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 95%;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
        }
        th {
            background: #222;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<h1>🧑‍💼 Panel Admin – Cofres</h1>

<!-- LOGIN -->
<div id="login">
    <p>🔐 Ingresa contraseña</p>
    <input type="password" id="password">
    <br>
    <button onclick="login()">Entrar</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
    <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>
    <h2>📊 Aperturas registradas</h2>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Jugador</th>
                <th>Perk</th>
                <th>Rareza</th>
                <th>Código</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<!-- ================= JS NORMAL ================= -->
<script>
const PASSWORD_ADMIN = "FSL9899199123"; // 🔴 puedes cambiarla

function login() {
    const pass = document.getElementById("password").value;
    if (pass === PASSWORD_ADMIN) {
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";
        sessionStorage.setItem("adminAuth", "true");
    } else {
        alert("❌ Contraseña incorrecta");
    }
}

function cerrarSesion() {
    sessionStorage.removeItem("adminAuth");
    location.reload();
}

if (sessionStorage.getItem("adminAuth") === "true") {
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
}
</script>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
  authDomain: "thefinalstrike-4358b.firebaseapp.com",
  databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
  projectId: "thefinalstrike-4358b",
  storageBucket: "thefinalstrike-4358b.firebasestorage.app",
  messagingSenderId: "857358899579",
  appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tabla = document.getElementById("tabla");
const aperturasRef = ref(db, "aperturas");

onValue(aperturasRef, (snapshot) => {
    tabla.innerHTML = "";
    let i = 1;

    snapshot.forEach(child => {
        const d = child.val();
        tabla.innerHTML += `
            <tr>
                <td>${i++}</td>
                <td>${d.jugador}</td>
                <td>${d.perk}</td>
                <td>${d.rareza}</td>
                <td>${d.codigo}</td>
                <td>${d.fecha}</td>
            </tr>
        `;
    });
});

console.log("🔥 Admin conectado a Firebase");
</script>

</body>
</html>
