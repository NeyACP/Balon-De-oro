<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin Cofres – Final Strike League</title>

<style>
body {
    background:#0e0e0e;
    color:white;
    font-family:Arial;
    text-align:center;
}
input, button {
    padding:10px;
    margin:5px;
}
table {
    width:95%;
    margin:auto;
    border-collapse:collapse;
}
th, td {
    border:1px solid #444;
    padding:8px;
}
th { background:#222; }
.hidden { display:none; }
</style>
</head>

<body>

<h1>🧑‍💼 Panel Admin – Cofres</h1>

<!-- LOGIN -->
<div id="login">
    <p>🔐 Contraseña</p>
    <input type="password" id="password">
    <br>
    <button onclick="login()">Entrar</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">

<h2>🔑 Generar códigos</h2>
<button onclick="generarCodigo()">➕ Generar código</button>

<ul id="listaCodigos"></ul>

<hr>

<button onclick="cargarAperturas()">🔄 Actualizar</button>
<button onclick="cerrarSesion()">🚪 Cerrar sesión</button>

<table>
<thead>
<tr>
    <th>#</th>
    <th>Jugador</th>
    <th>Perk</th>
    <th>Rareza</th>
    <th>Código</th>
    <th>Fecha</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzqFQflwICESu5CtVuVh8r54coZmTp5UM",
  authDomain: "thefinalstrike-4358b.firebaseapp.com",
  databaseURL: "https://thefinalstrike-4358b-default-rtdb.firebaseio.com",
  projectId: "thefinalstrike-4358b",
  storageBucket: "thefinalstrike-4358b.firebasestorage.app",
  messagingSenderId: "857358899579",
  appId: "1:857358899579:web:a56cd2f0f75df09eecc5de"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.ref = ref;
window.push = push;
window.set = set;
window.onValue = onValue;

console.log("🔥 Firebase Admin listo");
</script>

<!-- ================= LÓGICA ADMIN ================= -->
<script>
const PASSWORD_ADMIN = "FSL9899199123";

function login() {
    if (document.getElementById("password").value === PASSWORD_ADMIN) {
        localStorage.setItem("admin", "true");
        document.getElementById("login").style.display="none";
        document.getElementById("panel").style.display="block";
        mostrarCodigos();
        cargarAperturas();
    } else alert("Contraseña incorrecta");
}

function cerrarSesion() {
    localStorage.removeItem("admin");
    location.reload();
}

function generarCodigo() {
    const codigo = "FSL-" + Math.random().toString(36).substr(2,6).toUpperCase();
    set(ref(db, "codigos/" + codigo), {
        usado:false,
        creado:new Date().toISOString()
    });
}

function mostrarCodigos() {
    onValue(ref(db,"codigos"), snap=>{
        const lista=document.getElementById("listaCodigos");
        lista.innerHTML="";
        snap.forEach(c=>{
            if(!c.val().usado)
                lista.innerHTML+=`<li>${c.key}</li>`;
        });
    });
}

function cargarAperturas() {
    onValue(ref(db,"aperturas"), snap=>{
        const tabla=document.getElementById("tabla");
        tabla.innerHTML="";
        let i=1;
        snap.forEach(c=>{
            const d=c.val();
            tabla.innerHTML+=`
            <tr>
                <td>${i++}</td>
                <td>${d.jugador}</td>
                <td>${d.perk}</td>
                <td>${d.rareza}</td>
                <td>${d.codigo}</td>
                <td>${d.fecha}</td>
            </tr>`;
        });
    });
}

if(localStorage.getItem("admin")==="true"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    mostrarCodigos();
    cargarAperturas();
}
</script>

</body>
</html>
