<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Final Strike League</title>
  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .menu {
      background: #141414;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      width: 320px;
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
    }

    h1 {
      margin-bottom: 30px;
      color: gold;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .cofres {
      background: gold;
      color: black;
    }

    .votaciones {
      background: #444;
      color: white;
    }

    .votaciones:hover {
      background: #666;
    }

    .cofres:hover {
      background: #ffcc00;
    }
  </style>
</head>
<body>

  <div class="menu">
    <h1>🏆 Final Strike League</h1>

    <button class="cofres" onclick="irACofres()">
      🎁 Abrir Cofres
    </button>

    <button class="votaciones" onclick="comingSoon()">
      🗳 Votaciones (Coming Soon)
    </button>
  </div>

  <script>
    function irACofres() {
     <button onclick="window.location.href='cofres_pro.html'">
  Abrir cofres
</button>

    }

    function comingSoon() {
      alert("🚧 Votaciones disponibles pronto");
    }
  </script>

</body>
</html>
