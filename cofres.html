<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   <title>Cofres - The Final Strike League</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        .cofre {
            width: 150px;
            height: 150px;
            background: #facc15;
            margin: 20px auto;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .cofre:hover {
            transform: scale(1.05);
        }

        #resultado {
            margin-top: 30px;
            font-size: 22px;
        }

        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

  <h1>🎁 Cofre de The Final Strike League</h1>
    <p>Haz clic en el cofre para abrirlo</p>

    <div class="cofre" onclick="abrirCofre()">ABRIR</div>

    <div id="resultado"></div>

    <button onclick="resetear()">Abrir otro cofre</button> 
  
<h2>🎁 Abrir Cofre</h2>
<button onclick="abrirCofre()">Abrir Cofre</button>

<p id="resultado" style="margin-top:20px;font-size:18px;"></p>

    <script>
const perks = {
  bronce: [
    "Perk del Ex Delantero",
    "Perk del Monstruo",
    "Perk del Maestro de la Adaptación",
    "Perk del León Rojo",
    "Perk de No Voy a Perder",
    "Perk de Gagamaru"
  ],
  rara: [
    "Perk de Hiori"
  ],
  legendaria: [
    "Perk del Emperador",
    "Perk del Genio Total",
    "Perk del Egoísta"
  ]
};

function abrirCofre() {
  const random = Math.random() * 100;
  let rareza;
  let perk;

  if (random < 70) {
    rareza = "Bronce";
    perk = perks.bronce[Math.floor(Math.random() * perks.bronce.length)];
  } else if (random < 95) {
    rareza = "Rara";
    perk = perks.rara[0];
  } else {
    rareza = "Legendaria";
    perk = perks.legendaria[Math.floor(Math.random() * perks.legendaria.length)];
  }

  document.getElementById("resultado").innerHTML =
    "🎉 <b>" + perk + "</b><br>Rareza: <b>" + rareza + "</b>";
}
</script>

</body>
</html>
