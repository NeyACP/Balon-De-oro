<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cofres – Final Strike League</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            text-align: center;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .resultado {
            margin-top: 20px;
            font-size: 20px;
        }
        .log {
            margin-top: 20px;
            font-size: 14px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<h1>🎁 Cofres – Final Strike League</h1> 
<p>Haz clic en el cofre para abrirlo</p>
<h3>🔑 Ingresa tu código de cofre</h3>
<input type="text" id="codigoInput" placeholder="Código aquí">

<button onclick="abrirCofre()">Abrir Cofre</button>

<p>Cofres abiertos: <span id="contador">0</span></p>
<p>Piedad: <span id="piedad">0</span> / 20</p>

<div class="resultado" id="resultado"></div>

<div class="log" id="log"></div>

<script>
    // Códigos válidos (ejemplo)
    let codigosValidos = JSON.parse(localStorage.getItem("codigosValidos")) || [
        "FS-001",
        "FS-002",
        "FS-003"
    ];

    let codigosUsados = JSON.parse(localStorage.getItem("codigosUsados")) || [];

    
    let cofresAbiertos = 0;
    let piedad = 0;

    const PIEDAD_MAX = 20; // Cada 20 cofres = legendaria garantizada

    const perksBronze = [
        "Perk de Gagamaru",
        "Perk León Rojo",
        "Perk No perderé de vuelta",
        "Perk EX Delantero",
        "Perk del Monstruo",
        "Perk Maestro de la Adaptabilidad"
    ];

    const perksRara = [
        "Perk de Hiori"
    ];

    const perksLegendaria = [
        "Perk del Emperador",
        "Perk del Egoísta",
        "Perk del Genio Total"
    ];

    function abrirCofre() {
    let codigo = document.getElementById("codigoInput").value.trim();

    if (codigo === "") {
        alert("❌ Ingresa un código primero");
        return;
    }

    if (!codigosValidos.includes(codigo)) {
        alert("❌ Código inválido o ya usado");
        return;
    }

    // Marcar código como usado
    codigosValidos = codigosValidos.filter(c => c !== codigo);
    codigosUsados.push(codigo);

    localStorage.setItem("codigosValidos", JSON.stringify(codigosValidos));
    localStorage.setItem("codigosUsados", JSON.stringify(codigosUsados));

    cofresAbiertos++;
    piedad++;

    let resultado = "";
    let rareza = "";

    if (piedad >= PIEDAD_MAX) {
        resultado = obtenerAleatoria(perksLegendaria);
        rareza = "LEGENDARIA 👑 (GARANTIZADA)";
        piedad = 0;
    } else {
        let random = Math.random() * 100;

        if (random < 5) {
            resultado = obtenerAleatoria(perksLegendaria);
            rareza = "LEGENDARIA 👑";
            piedad = 0;
        } else if (random < 30) {
            resultado = obtenerAleatoria(perksRara);
            rareza = "RARA 💎";
        } else {
            resultado = obtenerAleatoria(perksBronze);
            rareza = "BRONZE 🟤";
        }
    }

    document.getElementById("contador").textContent = cofresAbiertos;
    document.getElementById("piedad").textContent = piedad;

    document.getElementById("resultado").innerHTML =
        `<strong>${resultado}</strong><br>Rareza: ${rareza}<br>Código usado: ${codigo}`;

    // Guardar historial
    let historial = JSON.parse(localStorage.getItem("historialCofres")) || [];
    historial.push({
        codigo: codigo,
        perk: resultado,
        rareza: rareza,
        fecha: new Date().toLocaleString()
    });

    localStorage.setItem("historialCofres", JSON.stringify(historial));
}


    function obtenerAleatoria(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
    }
</script>

</body>
</html>
